name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an annotated strict SemVer tag on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          core_number='(0|[1-9][0-9]*)'
          prerelease_identifier='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          build_identifier='[0-9A-Za-z-]+'
          semver="^v${core_number}\.${core_number}\.${core_number}(-${prerelease_identifier}(\.${prerelease_identifier})*)?(\+${build_identifier}(\.${build_identifier})*)?$"
          test "$GITHUB_REF_TYPE" = "tag"
          [[ "$GITHUB_REF_NAME" =~ $semver ]]
          tag_ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
          test "$(jq -r '.object.type' <<<"$tag_ref_json")" = "tag"
          tag_object_sha="$(jq -r '.object.sha' <<<"$tag_ref_json")"
          tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")"
          test "$(jq -r '.tag' <<<"$tag_json")" = "$GITHUB_REF_NAME"
          test "$(jq -r '.object.type' <<<"$tag_json")" = "commit"
          tagged_commit="$(jq -r '.object.sha' <<<"$tag_json")"
          test "$tagged_commit" = "$GITHUB_SHA"
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$tagged_commit" refs/remotes/origin/main

  verify:
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false

      - run: go mod verify
      - run: test -z "$(gofmt -l .)"
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

  binaries:
    needs: [verify-tag, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Build release binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            GOOS="${os}" GOARCH="${arch}" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/gguf-guard-${os}-${arch}" ./cmd/gguf-guard
          done
          (cd dist && sha256sum gguf-guard-* > SHA256SUMS)

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/source.spdx.json

      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "dist/gguf-guard-*"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums with keyless Sigstore
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
          files: |
            dist/gguf-guard-*
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
            dist/source.spdx.json

  container:
    needs: [verify-tag, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_NAME: ghcr.io/secai-hub/gguf-guard
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: release-metadata
        name: Derive collision-free OCI tag
        run: echo "container-tag=${GITHUB_REF_NAME//+/_}" >> "$GITHUB_OUTPUT"

      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.release-metadata.outputs.container-tag }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign container by digest
        run: cosign sign --yes "${IMAGE_NAME}@${{ steps.push.outputs.digest }}"
